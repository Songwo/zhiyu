name: 网页版镜像
# 正式版发布时由 release.yml 调用；也可以手动为已有标签重新构建并推送镜像。
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建镜像的正式版标签（例如 v1.14.0）
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZHIYU_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: 校验版本标签
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$ZHIYU_RELEASE_TAG"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zhiyu-web" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 构建并检查镜像
        run: |
          docker buildx build --load -t zhiyu-web:check .
          docker run -d --name zhiyu -p 8848:8848 -v "$RUNNER_TEMP/zhiyu-data:/data" zhiyu-web:check
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8848/api/web/state > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8848/api/web/state | grep -q "\"version\":\"$VERSION\""
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8848/)" = "302"
          docker logs zhiyu 2>&1 | grep -q '设置口令'
          sudo test -f "$RUNNER_TEMP/zhiyu-data/server/setup-token.txt"
          docker rm -f zhiyu
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=知屿 Zhiyu 网页版
            org.opencontainers.image.licenses=MIT

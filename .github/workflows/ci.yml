name: CI

on:
  push:
    branches: [main]
    # 只改文档、产品主页或图片时不跑完整检查；产品主页由「产品主页」工作流单独部署。
    paths-ignore: ["docs/**", "site/**", "**/*.md", "screenshots/**"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**/*.md", "screenshots/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `npm test` launches Chromium (scripts/extension-form.test.mjs and the
      # smoke suites), so the browser has to exist before the suite runs.
      # This must come AFTER `npm ci`: npx resolves the project's own pinned
      # Playwright, otherwise it silently downloads the latest one and
      # installs a mismatched browser build.
      - run: npm ci

      - name: 安装独立登录服务依赖
        working-directory: services/identity-login
        run: npm ci --omit=dev --ignore-scripts

      - run: npx playwright install chromium --with-deps

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run i18n:check

      # check:auth probes a *running* dev server's /__app-env, so boot one
      # first — which doubles as a cold-start smoke of `npm run dev`.
      - name: Check auth invariant against a live dev server
        run: |
          npm run dev &
          DEV_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/__app-env > /dev/null && break
            sleep 1
          done
          npm run check:auth &&
          node scripts/overview-hydration-integration.mjs &&
          node scripts/agent-composer-integration.mjs &&
          node scripts/agent-access-ui-integration.mjs &&
          node scripts/usage-live-chart-integration.mjs
          if [ $? -ne 0 ]; then kill $DEV_PID 2>/dev/null || true; exit 1; fi
          node scripts/service-assets-ui-integration.mjs &&
          node scripts/document-markdown-integration.mjs &&
          node scripts/document-account-extract-integration.mjs &&
          node scripts/wxpusher-ui-integration.mjs &&
          node scripts/page-scroll-integration.mjs &&
          node scripts/main-identity-ui-integration.mjs
          STATUS=$?
          kill $DEV_PID 2>/dev/null || true
          exit $STATUS

      - run: npm test

      - name: 验证独立登录服务与出站代理
        working-directory: services/identity-login
        run: npm test

      # Building the web bundle catches bundling and route-tree regressions
      # that typecheck alone misses; db:migrate exits early without
      # DATABASE_URL, so the step needs no secrets.
      - run: npm run build

      # 自托管网页版：构建同一份界面代码，跑一遍首次设置、跨设备同步与退出登录。
      - run: npm run web:build
      - run: node scripts/web-selfhost-integration.mjs

  web-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建网页版镜像
        run: docker build -t zhiyu-web:ci .
      - name: 启动镜像并检查登录页与接口
        run: |
          # 挂载一个由 Docker 自动创建（属于 root）的资料目录，确认容器能写入。
          docker run -d --name zhiyu -p 8848:8848 -v "$PWD/zhiyu-ci-data:/data" zhiyu-web:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8848/api/web/state > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8848/api/web/state | grep -q '"setup":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8848/)" = "302"
          curl -sf http://127.0.0.1:8848/login | grep -q '知屿'
          docker logs zhiyu 2>&1 | grep -q '设置口令'
          sudo test -f zhiyu-ci-data/server/setup-token.txt
          # 服务进程（PID 1）已降权为 node 用户
          test "$(docker exec zhiyu stat -c %U /proc/1)" = "node"
          docker rm -f zhiyu

name: 全平台正式版
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 重新验证并发布的现有正式标签（例如 v1.17.11）
        required: true
        default: "v1.17.11"
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      ZHIYU_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 校验版本标签与源码
        shell: pwsh
        run: |
          if ($env:ZHIYU_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid stable release tag' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:ZHIYU_RELEASE_TAG) { throw 'Version tag mismatch' }
          $tagCommit = git rev-parse "refs/tags/$($env:ZHIYU_RELEASE_TAG)^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag missing' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) { throw 'Release source mismatch' }
      - name: 规范 Windows 临时目录
        shell: pwsh
        run: |
          # 短文件名或大小写别名不能让文件系统测试的故障注入静默失效。
          $taskTempPath = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve temporary directory' }
          "TEMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - name: 安装独立登录服务依赖
        working-directory: services/identity-login
        run: npm ci --omit=dev --ignore-scripts
      - name: 安装 Electron 运行时
        run: node node_modules/electron/install.js
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - name: 构建并测试真实 Windows 原生终端
        run: npm run terminal:build
      - run: npm test
      - name: 验证独立登录服务与出站代理
        working-directory: services/identity-login
        run: npm test
      - run: node scripts/updater-engine-integration.mjs
      - run: npm run desktop:dist
      - name: 验证终端首次加载与跨页面保留
        run: node scripts/lazy-terminal-integration.mjs
      - name: 构建原生在线安装器并验证真实安装与卸载
        env:
          ZHIYU_INSTALLER_REAL_TEST: "1"
        run: npm run desktop:online
      - name: 生成 Windows 便携版
        run: npm run desktop:portable
      - name: 验证改名后的安装目录兼容
        run: node scripts/installer-directory-integration.mjs
      - name: 验证自启偏好与卸载清理
        run: node scripts/installer-startup-integration.mjs
      - name: 验证正式版彩色图标与任务栏分组
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/brand-icons-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
      - name: 验证本机默认监控与 Markdown 导入
        run: |
          node scripts/local-usage-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/markdown-import-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证卡片、检索原文提示、编辑器与分组导航
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $app = "release/v$version/win-unpacked/Zhiyu.exe"
          foreach ($script in @('sidebar-groups-integration', 'cards-desktop-integration', 'research-document-desktop-integration', 'document-editor-regression')) {
            node "scripts/$script.mjs" $app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 验证文档关系与 Agent 修改的正式程序接口
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $taskAppPath = "release/v$version/win-unpacked/Zhiyu.exe"
          if (!(Test-Path -LiteralPath $taskAppPath)) { throw 'Packaged application missing' }
          node scripts/workspace-v150-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/agent-access-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/vault-usability-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/security-patch-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sidebar-centering-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/storage-clear-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/backup-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/s3-backup-desktop-integration.mjs "$taskAppPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run extension:build
      - name: 验证正式程序的密码迁移与浏览器接口
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/passwords-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/identity-totp-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/main-identity-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/local-usage-packaged-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/subscription-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证浏览器插件真实交互
        run: node scripts/browser-companion-integration.mjs
      - name: 校验并暂存 Windows 附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = "release/v$version"
          $installer = "$directory/Zhiyu-$version-setup.exe"
          $online = "$directory/Zhiyu-$version-online-setup.exe"
          if (!(Test-Path $online)) { throw 'Online installer missing' }
          $extension = "$directory/Zhiyu-$version-browser-extension.zip"
          $portable = "$directory/Zhiyu-$version-portable-x64.zip"
          if (!(Test-Path $portable)) { throw 'Portable archive missing' }
          Compress-Archive -Path "$directory/zhiyu-browser-extension/*" -DestinationPath $extension
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $extensionHash = (Get-FileHash $extension -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          $onlineHash = (Get-FileHash $online -Algorithm SHA256).Hash.ToLower()
          @("$hash  Zhiyu-$version-setup.exe", "$onlineHash  Zhiyu-$version-online-setup.exe", "$portableHash  Zhiyu-$version-portable-x64.zip", "$extensionHash  Zhiyu-$version-browser-extension.zip") | Set-Content "$directory/SHA256SUMS.txt" -Encoding utf8
          $metadata = "$directory/latest.yml"
          $blockmap = "$installer.blockmap"
          if (!(Test-Path $metadata) -or !(Test-Path $blockmap)) { throw 'Update metadata missing' }
          $stage = Join-Path $env:RUNNER_TEMP "windows-release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          @($installer, $online, $portable, $extension, $metadata, $blockmap) | ForEach-Object { Copy-Item -LiteralPath $_ -Destination $stage }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ZHIYU_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 核对标签与版本
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$ZHIYU_RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$ZHIYU_RELEASE_TAG^{}")"
      - name: 规范 macOS 临时目录的真实路径
        run: |
          task_temp_path=$(node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())")
          test -d "$task_temp_path"
          echo "TMPDIR=$task_temp_path" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: 安装独立登录服务依赖
        working-directory: services/identity-login
        run: npm ci --omit=dev --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - name: 构建 DMG 与 ZIP
        run: npm run desktop:dist -- --mac --${{ matrix.arch }}
      - name: 校验应用、ZIP 与 DMG 的版本及芯片架构
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          version=$(node -p "require('./package.json').version")
          app=$(find "release/v$version" -maxdepth 2 -type d -name Zhiyu.app -print -quit)
          test -n "$app"
          python3 scripts/verify-macos-package.py --app "$app" --zip "release/v$version/Zhiyu-$version-mac-$BUILD_ARCH.zip" --version "$version" --arch "$BUILD_ARCH"
          mount="$RUNNER_TEMP/zhiyu-dmg-$BUILD_ARCH"
          mkdir -p "$mount"
          hdiutil attach "release/v$version/Zhiyu-$version-mac-$BUILD_ARCH.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force' EXIT
          python3 scripts/verify-macos-package.py --app "$mount/Zhiyu.app" --version "$version" --arch "$BUILD_ARCH"
          stage="$RUNNER_TEMP/mac-release-$BUILD_ARCH"
          mkdir -p "$stage"
          cp "release/v$version/Zhiyu-$version-mac-$BUILD_ARCH.dmg" "release/v$version/Zhiyu-$version-mac-$BUILD_ARCH.zip" "$stage/"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac-release-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-files
      - name: 全平台附件齐全并校验后才公开 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/publish-release.mjs "$RUNNER_TEMP/release-files" "$version"

  # Windows 与 macOS 全部验证、正式附件公开后再发布 Web 镜像。
  web-image:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/web-image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

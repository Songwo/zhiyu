name: Windows 正式版
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 重新验证并发布的现有正式标签（例如 v1.7.1）
        required: true
        default: "v1.7.1"
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      ZHIYU_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 校验版本标签与源码
        shell: pwsh
        run: |
          if ($env:ZHIYU_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid stable release tag' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:ZHIYU_RELEASE_TAG) { throw 'Version tag mismatch' }
          $tagCommit = git rev-parse "refs/tags/$($env:ZHIYU_RELEASE_TAG)^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag missing' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) { throw 'Release source mismatch' }
      - name: 规范 Windows 临时目录
        shell: pwsh
        run: |
          # 短文件名或大小写别名不能让文件系统测试的故障注入静默失效。
          $taskTempPath = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve temporary directory' }
          "TEMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - name: 安装独立登录服务依赖
        working-directory: services/identity-login
        run: npm ci --omit=dev --ignore-scripts
      - name: 安装 Electron 运行时
        run: node node_modules/electron/install.js
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - name: 验证独立登录服务与出站代理
        working-directory: services/identity-login
        run: npm test
      - run: node scripts/updater-engine-integration.mjs
      - run: npm run desktop:dist
      - name: 生成 Windows 便携版
        run: npm run desktop:portable
      - name: 验证改名后的安装目录兼容
        run: node scripts/installer-directory-integration.mjs
      - name: 验证正式版彩色图标与任务栏分组
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/brand-icons-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
      - name: 验证本机默认监控与 Markdown 导入
        run: |
          node scripts/local-usage-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/markdown-import-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证文档关系与 Agent 修改的正式程序接口
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/workspace-v150-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/agent-access-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/vault-usability-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/security-patch-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sidebar-centering-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/storage-clear-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run extension:build
      - name: 验证正式程序的密码迁移与浏览器接口
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/passwords-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/identity-totp-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/main-identity-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/local-usage-packaged-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/subscription-desktop-integration.mjs "release/v$version/win-unpacked/Zhiyu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证浏览器插件真实交互
        run: node scripts/browser-companion-integration.mjs
      - name: 校验文件与发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = "release/v$version"
          $installer = "$directory/Zhiyu-$version-setup.exe"
          $extension = "$directory/Zhiyu-$version-browser-extension.zip"
          $portable = "$directory/Zhiyu-$version-portable-x64.zip"
          if (!(Test-Path $portable)) { throw 'Portable archive missing' }
          Compress-Archive -Path "$directory/zhiyu-browser-extension/*" -DestinationPath $extension
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $extensionHash = (Get-FileHash $extension -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          @("$hash  Zhiyu-$version-setup.exe", "$portableHash  Zhiyu-$version-portable-x64.zip", "$extensionHash  Zhiyu-$version-browser-extension.zip") | Set-Content "$directory/SHA256SUMS.txt" -Encoding utf8
          $metadata = "$directory/latest.yml"
          $blockmap = "$installer.blockmap"
          if (!(Test-Path $metadata) -or !(Test-Path $blockmap)) { throw 'Update metadata missing' }
          gh release create "v$version" $installer $portable $extension $metadata $blockmap "$directory/SHA256SUMS.txt" --verify-tag --title "知屿 Zhiyu $version" --notes-file "docs/releases/v$version.md"

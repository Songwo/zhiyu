<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>登录 · 知屿 Zhiyu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/favicon.svg" alt="" width="56" height="56" />
      <h1 id="title">登录知屿</h1>
      <p class="sub" id="sub">你的数字资产工作台</p>
      <details class="warn" aria-label="Web 安全提醒">
        <summary>Web 端存在浏览器与服务器风险，敏感资产建议优先使用桌面端。</summary>
        <p>
          只登录自己信任的部署，使用 HTTPS
          和两步验证，避免公共设备及不可信扩展。密钥库解锁后恶意脚本可能读取明文；SSH、邮箱等操作需要服务器处理凭据。服务器加密存储不等于端到端加密，管理员仍有能力访问。桌面端也需要可信设备与及时更新。
        </p>
      </details>
      <p class="warn" id="insecure" role="note" hidden>
        当前是未加密的 http 连接：登录密码会在网络上明文传输，同一网络里的人能看到。公网使用请改用
        https，或只在可信的内网 / VPN 里访问。
      </p>
      <form id="form" novalidate>
        <label id="token-row" hidden>
          <span>设置口令</span>
          <input id="token" autocomplete="one-time-code" spellcheck="false" />
          <small>首次启动时打印在服务器日志里，也保存在资料目录的 server/setup-token.txt</small>
        </label>
        <label>
          <span>用户名</span>
          <input id="username" autocomplete="username" spellcheck="false" required />
        </label>
        <label>
          <span>登录密码</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <label id="code-row" hidden>
          <span>验证码（或恢复码）</span>
          <input
            id="code"
            inputmode="text"
            autocomplete="one-time-code"
            spellcheck="false"
            maxlength="24"
          />
          <small>打开手机上的验证器，输入 6 位数字；丢了手机可以用一次性的恢复码</small>
        </label>
        <label id="confirm-row" hidden>
          <span>再次输入密码</span>
          <input id="confirm" type="password" autocomplete="new-password" />
        </label>
        <p class="error" id="error" role="alert" hidden></p>
        <button id="submit" type="submit">登录</button>
      </form>
      <p class="foot">登录密码只用于打开网页；密码类资料由密钥库主密码在浏览器里加密。</p>
    </main>
    <script src="/login.js" type="module"></script>
  </body>
</html>

@keyframes p2_0{0%,21.077%{transform:translate(222px,130px);opacity:0}21.385%{transform:translate(222px,130px);opacity:1}23.385%{transform:translate(620px,130px);opacity:1}100%{transform:translate(620px,130px);opacity:1}}

.s5{animation:v5 65s linear infinite;opacity:0}
@keyframes p5_0{0%,51.077%{transform:translate(222px,130px);opacity:0}51.385%{transform:translate(222px,130px);opacity:1}53.385%{transform:translate(638px,130px);opacity:1}100%{transform:translate(638px,130px);opacity:1}}
.p5_0{animation:p5_0 65s ease-in-out infinite}
@keyframes v6{0%{opacity:0}60.000%{opacity:0}60.538%{opacity:1}69.462%{opacity:1}70.000%{opacity:0}100%{opacity:0}}
.s6{animation:v6 65s linear infinite;opacity:0}
@keyframes p6_0{0%,61.077%{transform:translate(222px,130px);opacity:0}61.385%{transform:translate(222px,130px);opacity:1}63.385%{transform:translate(616px,130px);opacity:1}100%{transform:translate(616px,130px);opacity:1}}
.p6_0{animation:p6_0 65s ease-in-out infinite}
@keyframes p6_1{0%,63.692%{transform:translate(546px,182px);opacity:0}64.000%{transform:translate(546px,182px);opacity:1}66.000%{transform:translate(222px,182px);opacity:1}100%{transform:translate(222px,182px);opacity:1}}
.p6_1{animation:p6_1 65s ease-in-out infinite}

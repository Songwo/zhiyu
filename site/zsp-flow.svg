@keyframes p3_0{0%,31.077%{transform:translate(222px,130px);opacity:0}31.385%{transform:translate(222px,130px);opacity:1}33.385%{transform:translate(590px,130px);opacity:1}100%{transform:translate(590px,130px);opacity:1}}

@keyframes p3_1{0%,33.692%{transform:translate(577px,182px);opacity:0}34.000%{transform:translate(577px,182px);opacity:1}36.000%{transform:translate(222px,182px);opacity:1}100%{transform:translate(222px,182px);opacity:1}}
.p3_1{animation:p3_1 65s ease-in-out infinite}
@keyframes v4{0%{opacity:0}40.000%{opacity:0}40.538%{opacity:1}49.462%{opacity:1}50.000%{opacity:0}100%{opacity:0}}
.s4{animation:v4 65s linear infinite;opacity:0}
@keyframes p4_0{0%,41.077%{transform:translate(547px,182px);opacity:0}41.385%{transform:translate(547px,182px);opacity:1}43.385%{transform:translate(222px,182px);opacity:1}100%{transform:translate(222px,182px);opacity:1}}
.p4_0{animation:p4_0 65s ease-in-out infinite}
